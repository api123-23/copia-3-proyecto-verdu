[build]
  command = "env -u GEMINI_API_KEY -u OPENROUTER_API_KEY -u SUPABASE_SERVICE_ROLE_KEY npm run build"

[build.environment]
  # Supabase anon keys are intentionally public and are required by the
  # browser client. Private server keys are not allowlisted here.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY"
